name: Monthly data refresh

# Houses of worship are close to a fixed inventory — the last three months of
# OSM editing moved the count by 26 out of 2,847. Monthly keeps it honest
# without hammering volunteer-run Overpass infrastructure.
on:
  schedule:
    - cron: '50 10 1 * *'   # 1st of the month, 6:50 AM ET
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull from Overpass
        run: python3 fetch_raw.py

      - name: Rebuild data.json
        run: python3 process.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw.json data.json
          if git diff --staged --quiet; then
            echo "No data changes -- skipping commit"
          else
            git commit -m "Monthly data refresh: $(date -u +%Y-%m-%d)"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin main; then pushed=true; break; fi
              echo "Push rejected (attempt $attempt) — rebasing on latest main…"
              git pull --rebase --autostash origin main
            done
            $pushed || { echo "Push failed after retries"; exit 1; }
          fi
